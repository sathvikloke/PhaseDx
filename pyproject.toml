[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phasedx-external"
version = "0.1.0"
description = "Frozen PhaseDx external-study execution tools"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3", "pandas>=2.2,<3", "scipy>=1.15,<2",
  "pydicom>=3.0,<4", "scikit-learn>=1.6,<2", "psutil>=7,<8"
]

[project.optional-dependencies]
inference = ["torch>=2.10,<3", "torchvision>=0.25,<1"]
lossless = ["pylibjpeg==2.1.0", "pylibjpeg-libjpeg==2.3.0"]
decoder-check = ["python-gdcm==3.2.2"]
test = ["pytest>=8,<10"]

[project.scripts]
phasedx-external = "phasedx_external.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/external"]
pythonpath = ["src"]
