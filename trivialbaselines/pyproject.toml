[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trivialbaselines"
version = "1.0.0"
description = "Zero-image null models for slice-labelled medical imaging benchmarks: audit a published benchmark from its label file alone."
readme = "README.md"
license = { text = "CC-BY-4.0" }
requires-python = ">=3.10"
keywords = [
    "medical-imaging", "benchmark", "shortcut-learning", "leakage",
    "baseline", "evaluation", "auroc", "reproducibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# numpy and pandas. Nothing else, ever.
#
# The premise of this tool is that a slice-level benchmark can be audited with no
# images, no data-use agreement for pixels and no GPU. A dependency on torch, or on
# scikit-learn, would make that claim unverifiable in practice -- a reviewer would have
# to take it on trust rather than reading the dependency list. So the rank statistics,
# the clustered bootstrap and the depth-limited CART are all implemented here against
# numpy, and `pip install trivialbaselines` pulls in nothing that needs a compiler
# toolchain or a CUDA runtime.
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
]

[[project.authors]]
name = "Sathvik Loke"
email = "sloke@imsa.edu"

[[project.authors]]
name = "Ethan Johnson"
email = "ethanthekek21@gmail.com"

[[project.authors]]
name = "Neeraj Movva"
email = "nmovva@imsa.edu"

[[project.authors]]
name = "Aditya Raut"
email = "aditya.sraut09@gmail.com"

[project.optional-dependencies]
# Only needed to read .parquet label tables; .csv and .tsv work without it.
parquet = ["pyarrow>=12"]
# Only used by the self-test, to cross-check the built-in CART against a reference
# implementation. The self-test passes without it (it falls back to a weaker check).
dev = ["scikit-learn>=1.1", "pytest>=7"]

[project.scripts]
trivial-baselines = "trivialbaselines.core:main"

[project.urls]
Homepage = "https://github.com/sathvikloke/PhaseDx"
Source = "https://github.com/sathvikloke/PhaseDx/tree/main/trivialbaselines"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trivialbaselines = ["py.typed"]
